name: Deploy site

# Builds nirantar.xyz and deploys it to GitHub Pages.
#
# Social card images are rendered here, straight into the deployed site, and are
# never committed: git history keeps every committed file forever, so committing
# ~3 MB of images a day would grow the repo ~1 GB a year even with cleanup.
# Only social/YYYY-MM-DD/social.json (a few KB) lives in the repo; each deploy
# renders the last KEEP_DAYS days of cards from it.

on:
  push:
    branches: [main]
  # the RSS workflow pushes with GITHUB_TOKEN, which does not trigger push workflows
  workflow_run:
    workflows: ["Update Substack RSS"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KEEP_DAYS: 5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cards/requirements.txt

      - name: Install card renderer
        run: pip install -r cards/requirements.txt

      - name: Assemble static site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'social' ./ _site/

      - name: Render recent social cards
        run: |
          cutoff=$(date -u -d "$KEEP_DAYS days ago" +%Y-%m-%d)
          for json in social/*/social.json; do
            [[ -f "$json" ]] || continue
            day=$(basename "$(dirname "$json")")
            [[ "$day" < "$cutoff" ]] && continue
            mkdir -p "_site/social/$day"
            cp "$json" "_site/social/$day/social.json"
            # a card that does not fit must never block the site deploy;
            # status.json carries the error for the newsletter task to read
            (cd cards && python broadsheet.py "../_site/social/$day/social.json") \
              || echo "::warning::social cards for $day failed to render, see /social/$day/status.json"
          done

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
