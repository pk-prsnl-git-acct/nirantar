name: Update Substack RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0,2,4,6,8,10,12,14,16 * * *"

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Substack RSS
        run: node scripts/fetch-substack-rss.mjs

      - name: Commit updated posts
        run: |
          if [[ -n "$(git status --porcelain posts.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Update Substack RSS posts"
            git push
          else
            echo "No RSS changes."
          fi
