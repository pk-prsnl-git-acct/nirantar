name: Render social cards

# The daily newsletter task commits social/YYYY-MM-DD/social.json.
# This renders the carousel + X card next to it and commits them, which
# triggers the Pages deploy so Buffer can fetch them from nirantar.xyz.

on:
  push:
    branches: [main]
    paths:
      - "social/*/social.json"
  workflow_dispatch:
    inputs:
      date:
        description: "Re-render one day (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

concurrency:
  group: render-social-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cards/requirements.txt

      - name: Install renderer
        run: pip install -r cards/requirements.txt

      - name: Find changed issues
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            files="social/$INPUT_DATE/social.json"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            files=$(git diff --name-only HEAD~1 HEAD -- 'social/*/social.json')
          else
            files=$(git diff --name-only "$BEFORE" HEAD -- 'social/*/social.json')
          fi
          echo "files=$(echo $files)" >> "$GITHUB_OUTPUT"
          echo "Rendering: $files"

      - name: Render cards
        if: steps.changed.outputs.files != ''
        working-directory: cards
        run: |
          status=0
          for f in ${{ steps.changed.outputs.files }}; do
            [[ -f "../$f" ]] || continue
            # status.json records success or the exact fit error for the pipeline to read
            python broadsheet.py "../$f" || status=1
          done
          echo "RENDER_STATUS=$status" >> "$GITHUB_ENV"

      - name: Prune images older than 30 days
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          for d in social/*/; do
            day=$(basename "$d")
            if [[ "$day" < "$cutoff" ]]; then
              # LinkedIn and X keep their own copies once posted; keep only the small JSON as an archive
              rm -f "$d"*.jpg "$d"*.pdf
            fi
          done

      - name: Commit rendered cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A social
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Render social cards: ${{ steps.changed.outputs.files }}"
          # the RSS workflow also pushes to main; rebase and retry on a race
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Fail loudly if a card did not fit
        if: env.RENDER_STATUS == '1'
        run: |
          echo "::error::One or more issues failed to render; see social/*/status.json"
          exit 1
